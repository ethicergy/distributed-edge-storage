; edge-kv firmware: one image, four node ids.
;
;   pio run -e node-a -t upload        flash node A (likewise node-b..d)
;   pio device monitor -e node-a       console (115200 baud, type 'help')
;
; The *-fi environments compile in fault injection (console commands
; `fault ...` and `stale ...`) for the reliability tests H4, H5, H10.
; Never deploy them as the normal image.

[platformio]
default_envs = node-a

[env]
; Pinned: transport.cpp uses the ESP-IDF 4.4 ESP-NOW callback
; signatures of Arduino-ESP32 2.0.x. A platform upgrade must be a
; deliberate change (and the build stops with #error on IDF >= 5).
platform = espressif32@7.1.3
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; No monitor_rts/monitor_dtr: forcing them to 0 resets the C3 on every
; monitor open (USB-Serial-JTAG). The defaults leave both set: no reset.
; Defines EDGE_GIT_REV (commit of the firmware sources) for the banner.
extra_scripts = pre:scripts/pio_git_rev.py
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Env name for the boot banner (src/platform/main.cpp).
    '-DEDGE_ENV_NAME="$PIOENV"'
    ; Node that talks to the Raspberry Pi over UART1 (GPIO20 RX, GPIO21 TX).
    -DEDGE_BRIDGE_NODE_ID=1
; DHT11 driver (src/platform/sensors.cpp), pinned like the platform.
lib_deps =
    adafruit/DHT sensor library@1.4.7
    adafruit/Adafruit Unified Sensor@1.1.15

[env:node-a]
build_flags =
    ${env.build_flags}
    -DNODE_ID=1

[env:node-b]
build_flags =
    ${env.build_flags}
    -DNODE_ID=2

[env:node-c]
build_flags =
    ${env.build_flags}
    -DNODE_ID=3

[env:node-d]
build_flags =
    ${env.build_flags}
    -DNODE_ID=4

[env:node-a-fi]
build_flags =
    ${env.build_flags}
    -DNODE_ID=1
    -DEDGE_FAULT_INJECTION=1

[env:node-b-fi]
build_flags =
    ${env.build_flags}
    -DNODE_ID=2
    -DEDGE_FAULT_INJECTION=1

[env:node-c-fi]
build_flags =
    ${env.build_flags}
    -DNODE_ID=3
    -DEDGE_FAULT_INJECTION=1

[env:node-d-fi]
build_flags =
    ${env.build_flags}
    -DNODE_ID=4
    -DEDGE_FAULT_INJECTION=1
