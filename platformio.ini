[platformio]
default_envs = node-a

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:node-a]
build_flags =
    ${env.build_flags}
    -DNODE_ID=1

[env:node-b]
build_flags =
    ${env.build_flags}
    -DNODE_ID=2